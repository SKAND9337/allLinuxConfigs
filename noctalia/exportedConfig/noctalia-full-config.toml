[theme]
builtin = "Noctalia"
community_palette = "Spiderman"
custom_palette = ""
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "emacs", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [
        "pywalfox",
        "pywalfox-beta4",
        "zen-browser",
        "telegram",
        "micro",
        "obsidian",
        "vscode",
        "heroiclauncher",
        "steam",
        "rofi",
        "obs",
        "hyprtoolkit",
        "papirus-icons"
    ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.superfile]
        compare_to = ""
        enabled = true
        hook_async = true
        index = 0
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/superfile.toml"
        output_path = [ "$XDG_CONFIG_HOME/superfile/theme/noctalia.toml" ]
        output_path_dynamic = ""
        post_action = ""
        post_hook = ""
        pre_hook = ""

[wallpaper]
directory = "/home/skand/Pictures/WALLPAPERS"
directory_dark = ""
directory_light = ""
edge_smoothness = 0.34999999403953552
enabled = true
fill_color = ""
fill_mode = "crop"
per_monitor_directories = false
transition = [ "disc", "honeycomb", "stripes", "wipe", "zoom" ]
transition_duration = 2400.0
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 100
    order = "random"
    recursive = false

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"

[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
font_family = "Cinzel"
font_weight = 600
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.privacy]
color = "error"
hide_inactive = true
icon_color = "error"
icon_spacing = 3
type = "privacy"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.spacer]
interactive = false
type = "spacer"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.tracker]
glyph = "brand-youtube"
type = "cleboost/anilist:tracker"

[widget.wallpaper]
type = "wallpaper"

    [widget.wallpaper.actions]
    right = "wallpaper-random"

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
label_source = "name"
type = "workspaces"
